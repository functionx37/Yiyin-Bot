services:
  nonebot:
    build: .
    container_name: yiyin-nonebot
    env_file: .env.prod
    environment:
      # 供 NapCat 读取语录/食物图片的路径前缀（NapCat 需挂载同名 data 卷）
      - ONEBOT_IMAGE_BASE_PATH=/app/data
    volumes:
      - ./data:/app/data
      - ./.local:/app/.local
    restart: unless-stopped
    networks:
      - bot-network
    deploy:
      resources:
        limits:
          cpus: "1.5"
          # 2GB 服务器建议设为 1280M，为 napcat 和系统预留约 768M
          memory: 1280M
        reservations:
          memory: 512M

  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: yiyin-napcat
    environment:
      - NAPCAT_UID=0
      - NAPCAT_GID=0
    ports:
      - "6099:6099"   # NapCat WebUI
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./napcat/data:/app/.config/QQ
      # 与 nonebot 共享 data，供合并转发中的图片使用本地路径（NapCat 读取）
      - ./data:/app/data
    depends_on:
      - nonebot
    restart: unless-stopped
    networks:
      - bot-network
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  bot-network:
    driver: bridge
