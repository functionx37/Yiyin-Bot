services:
  nonebot:
    build: .
    container_name: yiyin-nonebot
    env_file: .env.prod
    volumes:
      # 使用 ${PWD} 确保挂载项目根目录的 data，避免从其它目录启动时挂载到错误的空目录
      - ${PWD}/data:/app/data
      - ${PWD}/.local:/app/.local
    restart: unless-stopped
    networks:
      - bot-network
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M

  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: yiyin-napcat
    environment:
      - NAPCAT_UID=0
      - NAPCAT_GID=0
    ports:
      - "6099:6099"   # NapCat WebUI
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./napcat/data:/app/.config/QQ
    depends_on:
      - nonebot
    restart: unless-stopped
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge
